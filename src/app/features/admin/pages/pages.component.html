<div class="flex flex-col h-screen overflow-hidden bg-slate-50 text-slate-800">
  <header class="h-14 px-3 sm:px-6 bg-white flex items-center justify-between border-b border-slate-200 shrink-0 z-[1000]">
    <a routerLink="/" class="flex items-center gap-2">
      <img src="/logo.png" class="w-8 h-auto" alt="Logo">
      <span class="text-lg font-bold text-slate-900">UnoFive</span>
      <span class="hidden sm:inline text-sm text-slate-400 border-l border-slate-200 pl-2 ml-1">Administration</span>
    </a>

    <div *ngIf="isLoggedIn">
      <button [matMenuTriggerFor]="m" class="flex items-center gap-2 py-1 pl-1 pr-2 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
        <span class="w-8 h-8 bg-slate-800 text-white rounded-full flex items-center justify-center text-xs font-semibold">{{ mesinitial }}</span>
        <span class="hidden sm:block text-sm text-slate-700">{{ userInfo?.nom }}</span>
        <mat-icon class="text-slate-400 !text-lg">expand_more</mat-icon>
      </button>

      <mat-menu #m="matMenu" xPosition="before">
        <div class="px-4 py-3 border-b border-slate-100">
          <p class="text-sm font-semibold text-slate-900 truncate">{{ userInfo?.nom }}</p>
          <p class="text-xs text-slate-500">{{ userInfo?.isAdmin ? 'Administrateur' : 'Utilisateur' }}</p>
        </div>
        <button mat-menu-item routerLink="/">
          <mat-icon>map</mat-icon>Retour au site
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon class="!text-red-600">logout</mat-icon><span class="text-red-600">Déconnexion</span>
        </button>
      </mat-menu>
    </div>
  </header>

  <!-- Téléphone : navigation en onglets défilants à la place de la barre latérale -->
  <nav *ngIf="userInfo?.isAdmin" class="md:hidden flex gap-1 overflow-x-auto bg-white border-b border-slate-200 px-2 py-2 shrink-0" aria-label="Administration">
    <a *ngFor="let item of navItems"
       [routerLink]="item.link"
       routerLinkActive="!bg-slate-100 !text-slate-900 font-medium"
       [routerLinkActiveOptions]="{ exact: item.exact }"
       class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm text-slate-600 whitespace-nowrap">
      <mat-icon class="!text-lg !w-5 !h-5 !leading-5 text-slate-500">{{ item.icon }}</mat-icon>
      {{ item.label }}
    </a>
  </nav>

  <div class="flex flex-1 overflow-hidden">
    <aside *ngIf="userInfo?.isAdmin" class="hidden md:block w-60 bg-white border-r border-slate-200 shrink-0 p-4">
      <nav class="space-y-1">
        <a *ngFor="let item of navItems"
           [routerLink]="item.link"
           routerLinkActive="!bg-slate-100 !text-slate-900 font-medium"
           [routerLinkActiveOptions]="{ exact: item.exact }"
           class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
          <mat-icon class="!text-xl text-slate-500">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
