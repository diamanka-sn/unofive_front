<div class="text-slate-800">
  <div class="flex items-center gap-3 px-4 border-b border-slate-200">
    <mat-icon class="text-slate-400 shrink-0">search</mat-icon>
    <input #searchInput type="text" [(ngModel)]="query" (ngModelChange)="refresh()" (keydown)="onKeydown($event)"
           placeholder="Rechercher un pays ou une page…" aria-label="Rechercher"
           role="combobox" aria-controls="search-results" [attr.aria-activedescendant]="'search-item-' + activeIndex"
           autocomplete="off" cdkFocusInitial
           class="flex-1 py-4 text-base bg-transparent outline-none placeholder:text-slate-400">
    <kbd class="hidden sm:inline text-xs text-slate-500 border border-slate-300 rounded px-1.5 py-0.5">Échap</kbd>
  </div>

  <div id="search-results" role="listbox" class="max-h-[60vh] overflow-y-auto py-2">
    <section *ngFor="let group of results" class="pb-1">
      <p class="px-4 pt-2 pb-1 text-xs font-medium text-slate-500">{{ group.title }}</p>
      <button *ngFor="let item of group.items" type="button" role="option"
              [id]="'search-item-' + indexOf(item)"
              [attr.aria-selected]="indexOf(item) === activeIndex"
              (click)="select(item)" (mouseenter)="activeIndex = indexOf(item)"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-left cursor-pointer"
              [ngClass]="indexOf(item) === activeIndex ? 'bg-slate-100' : ''">
        <mat-icon class="text-slate-500 shrink-0 !text-xl !w-5 !h-5">{{ item.icon }}</mat-icon>
        <span class="flex-1 min-w-0">
          <span class="block text-sm font-medium text-slate-900 truncate">{{ item.label }}</span>
          <span class="block text-xs text-slate-500 truncate">{{ item.hint }}</span>
        </span>
        <mat-icon *ngIf="indexOf(item) === activeIndex" class="text-slate-400 shrink-0 !text-lg !w-5 !h-5">keyboard_return</mat-icon>
      </button>
    </section>

    <p *ngIf="query && !results.length && !loadingCountries" class="px-4 py-8 text-center text-sm text-slate-500">
      Aucun résultat pour « {{ query }} ».
    </p>
    <p *ngIf="!query" class="px-4 pt-2 pb-1 text-xs text-slate-500">
      Tapez le nom d'un pays pour l'afficher sur la carte.
    </p>
  </div>

  <div class="hidden sm:flex items-center gap-4 px-4 py-2.5 border-t border-slate-200 text-xs text-slate-500">
    <span><kbd class="border border-slate-300 rounded px-1">↑</kbd> <kbd class="border border-slate-300 rounded px-1">↓</kbd> naviguer</span>
    <span><kbd class="border border-slate-300 rounded px-1">Entrée</kbd> ouvrir</span>
  </div>
</div>
