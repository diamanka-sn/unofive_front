<form (ngSubmit)="confirm()" class="p-6 text-slate-800">
  <h2 class="text-lg font-semibold text-slate-900">Imprimer la carte</h2>
  <p class="text-sm text-slate-500 mt-1">{{ data.summary }}</p>

  <div class="mt-5 space-y-4">
    <div>
      <label for="print-title" class="block text-sm font-medium text-slate-900 mb-1">Titre</label>
      <input id="print-title" name="title" [(ngModel)]="data.title" required maxlength="120"
             class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400">
    </div>

    <div>
      <label for="print-notes" class="block text-sm font-medium text-slate-900 mb-1">
        Observations <span class="font-normal text-slate-500">(facultatif)</span>
      </label>
      <textarea id="print-notes" name="description" [(ngModel)]="data.description" rows="3" maxlength="600"
                placeholder="Ex. : forte hausse des décès dans le bassin du Niger."
                class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm resize-y focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-400"></textarea>
    </div>

    <fieldset>
      <legend class="text-sm font-medium text-slate-900 mb-1.5">Zone imprimée</legend>
      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center gap-2 px-3 py-2 border rounded-md text-sm cursor-pointer"
               [ngClass]="data.framing === 'africa' ? 'border-slate-900 bg-slate-50' : 'border-slate-300'">
          <input type="radio" name="framing" value="africa" [(ngModel)]="data.framing" class="accent-slate-900">
          Toute l'Afrique
        </label>
        <label class="flex items-center gap-2 px-3 py-2 border rounded-md text-sm cursor-pointer"
               [ngClass]="data.framing === 'current' ? 'border-slate-900 bg-slate-50' : 'border-slate-300'">
          <input type="radio" name="framing" value="current" [(ngModel)]="data.framing" class="accent-slate-900">
          Vue actuelle
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend class="text-sm font-medium text-slate-900 mb-1.5">Orientation (A4)</legend>
      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center gap-2 px-3 py-2 border rounded-md text-sm cursor-pointer"
               [ngClass]="data.orientation === 'landscape' ? 'border-slate-900 bg-slate-50' : 'border-slate-300'">
          <input type="radio" name="orientation" value="landscape" [(ngModel)]="data.orientation" class="accent-slate-900">
          Paysage
        </label>
        <label class="flex items-center gap-2 px-3 py-2 border rounded-md text-sm cursor-pointer"
               [ngClass]="data.orientation === 'portrait' ? 'border-slate-900 bg-slate-50' : 'border-slate-300'">
          <input type="radio" name="orientation" value="portrait" [(ngModel)]="data.orientation" class="accent-slate-900">
          Portrait
        </label>
      </div>
    </fieldset>

  </div>

  <div class="flex justify-end gap-2 mt-6">
    <button type="button" mat-dialog-close
            class="px-4 py-2 border border-slate-300 text-slate-700 rounded-md text-sm font-medium hover:bg-slate-50 transition-colors cursor-pointer">
      Annuler
    </button>
    <button type="submit" [disabled]="!data.title.trim()"
            class="flex items-center gap-1.5 px-4 py-2 bg-slate-900 text-white rounded-md text-sm font-medium hover:bg-slate-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      <mat-icon class="!text-lg !w-5 !h-5">print</mat-icon> Imprimer
    </button>
  </div>
</form>
